# SuperLibrary on the staging plane (workbench), checked out at /opt/suite-staging/superlibrary.
# Both Workers run under workerd through `wrangler dev`, sharing the `state` volume (D1, R2, Queues):
#   superlibrary          apps/api, `--env staging` (apps/api/wrangler.jsonc), serving the SPA
#                         (apps/web/build) as its assets; Workers AI and Vectorize are remote.
#   superlibrary-content  apps/content (wrangler.dev.jsonc, staging values by --var). It reads the
#                         API's bucket; item hosts need a wildcard certificate, so it is not routed.
# They sign in against staging-accounts and reach only other staging copies; no production secret
# is reused. The shared edge (cloudflared on the external `suite-staging` network) routes
# staging-app.superlibrary.dev to `superlibrary:8787`. deploy.sh installs and builds before `up`.
name: staging-superlibrary

x-node: &node
  image: node:22.20.0-bookworm
  environment:
    CI: "true"
    WRANGLER_SEND_METRICS: "false"
  env_file:
    # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID: the remote AI and Vectorize bindings only.
    - ../../../env/cloudflare.env
  volumes:
    - ../..:/app
    - state:/state
    - ../../../env/superlibrary:/run/secrets:ro

services:
  superlibrary:
    <<: *node
    working_dir: /app/apps/api
    restart: unless-stopped
    # --test-scheduled exposes /__scheduled; workerd never fires crons on its own, so `cron` calls it.
    command:
      - sh
      - -c
      - exec node_modules/.bin/wrangler dev --env staging --ip 0.0.0.0 --port 8787 --persist-to /state
        --env-file /run/secrets/api.env --test-scheduled --show-interactive-dev-session=false
    ports:
      - "127.0.0.1:8790:8787"
    networks: [default, suite-staging]

  superlibrary-content:
    <<: *node
    working_dir: /app/apps/content
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec node_modules/.bin/wrangler dev -c wrangler.dev.jsonc --ip 0.0.0.0 --port 8788 --persist-to /state
        --env-file /run/secrets/content.env --show-interactive-dev-session=false
        --var CONTENT_DOMAIN:staging-content.superlibrary.dev
        --var "FRAME_ANCESTORS:https://staging-app.superlibrary.dev https://staging-app.superpipeline.dev https://staging-console.agentpod.dev"
    networks: [default]

  # Applies D1 migrations to the persisted state. Run by deploy.sh before `up` (profile: tools).
  migrate:
    <<: *node
    working_dir: /app/apps/api
    profiles: [tools]
    command: ["node_modules/.bin/wrangler", "d1", "migrations", "apply", "DB", "--local", "--env", "staging", "--persist-to", "/state"]

  # The three triggers in wrangler.jsonc (0 * * * *, 0 3 * * *, 30 3 * * *), fired the only way
  # workerd can be: by asking for them, once in the minute each is due (UTC).
  cron:
    image: curlimages/curl:8.16.0
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        fire() { curl -fsS -o /dev/null "http://superlibrary:8787/__scheduled?cron=$$1" && echo "$$(date -u +%FT%TZ) scheduled $$1"; }
        last=
        while sleep 20; do
          now=$$(date -u +%H%M); [ "$$now" = "$$last" ] && continue; last=$$now
          case $$now in ??00) fire '0+*+*+*+*' ;; esac
          [ "$$now" = 0300 ] && fire '0+3+*+*+*'
          [ "$$now" = 0330 ] && fire '30+3+*+*+*'
        done
    depends_on: [superlibrary]

networks:
  suite-staging:
    external: true

volumes:
  state:
