<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Superlibrary">
  <!-- The Superlibrary mark: two upright book spines and a third leaning against them.
       Solid spines, a 4.5-unit width and 2-unit gaps so they stay apart at 16px. The same three
       rects as src/lib/Mark.svelte and scripts/render-icons.sh; change them together. -->
  <rect width="32" height="32" rx="7" fill="#0f1118"/>
  <g fill="#ff7a59">
    <rect x="5.5" y="9.5" width="4.5" height="15.5" rx="1"/>
    <rect x="12" y="7" width="4.5" height="18" rx="1"/>
    <rect x="22.3" y="8" width="4.5" height="17" rx="1" transform="rotate(-20 22.3 25)"/>
  </g>
</svg>
