    <!-- vk:head --><script>(function(){try{var d=document,m=/(?:^|; )vk_appearance=([^;]*)/.exec(d.cookie||""),p=(m?m[1]:"").split("."),V=["daylight","paper","studio","quiet"],v=V.indexOf(p[0])>-1?p[0]:"daylight",t=["sun","light","dark"].indexOf(p[1])>-1?p[1]:"sun",s=["strong","subtle","off"].indexOf(p[2])>-1?p[2]:(v==="quiet"?"off":"strong"),n=new Date(),x=n.getHours()*60+n.getMinutes(),h=x<330||x>=1140?"night":x<420?"dawn":x>=1065?"dusk":x>=990?"golden":x<648?"morning":"noon",e=d.documentElement;e.setAttribute("data-vibe",v);e.setAttribute("data-theme",t==="sun"?(h==="night"?"dark":"light"):t);e.setAttribute("data-phase",h);e.setAttribute("data-time",s)}catch(_){}})();</script><!-- /vk:head -->
