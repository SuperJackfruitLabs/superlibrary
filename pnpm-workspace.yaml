packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
# pnpm's default one-day release age, waived for the suite's own contract packages at the exact
# pinned version only. Drop an entry once its version is a day old.
minimumReleaseAgeExclude:
  - '@superjackfruitlabs/treaty-ecosystem-identity@0.0.15'
  - '@superjackfruitlabs/treaty-contracts@0.0.15'
