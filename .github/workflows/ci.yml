name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The CLI runs under bun.
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    # The whole suite (Chromium and WebKit, the seeded loading, fit and motion specs) takes about 15 minutes locally.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Chromium and WebKit builds this Playwright version pins (Chromium's headless shell
      # included), and their system libraries. WebKit runs the containment and phone-width specs.
      - run: pnpm --filter @superlibrary/web exec playwright install --with-deps chromium webkit
      # Writes a fresh dev signing pair (no .dev.vars in CI), then boots the API (:8787), the content
      # Worker (:8788) and the web dev server (:5173), headless.
      - run: pnpm --filter @superlibrary/web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/web/test-results/
          retention-days: 7
      # Every vibe x theme x key screen, for a person to look at (spec D10). Pixel comparison is PW_VISUAL=1, later.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-screens
          path: apps/web/vibe-screens/
          if-no-files-found: ignore
          retention-days: 14

  # CLOUDFLARE_API_TOKEN is a repository-level secret: the three environments below (production,
  # content, web) have different names and must not hold it.
  # Continuous deploy, as Superpipeline: after test and e2e pass on main, migrate D1 and ship.
  deploy-api:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: { group: deploy-api, cancel-in-progress: false }
    environment: { name: production, url: https://app.superlibrary.dev/api/health }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 88acd85618f099112eadc9374996b9f7
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      # Deploys can queue out of order: a run for a superseded commit must not overwrite a newer one.
      - id: fresh
        run: |
          git fetch --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_SHA is no longer the head of main; skipping this deploy"
          fi
      - if: steps.fresh.outputs.current == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.fresh.outputs.current == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: steps.fresh.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.fresh.outputs.current == 'true'
        run: pnpm --filter @superlibrary/api db:migrate
      - if: steps.fresh.outputs.current == 'true'
        run: pnpm --filter @superlibrary/api run deploy

  deploy-content:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: { group: deploy-content, cancel-in-progress: false }
    environment: { name: content }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 88acd85618f099112eadc9374996b9f7
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      # Deploys can queue out of order: a run for a superseded commit must not overwrite a newer one.
      - id: fresh
        run: |
          git fetch --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_SHA is no longer the head of main; skipping this deploy"
          fi
      - if: steps.fresh.outputs.current == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.fresh.outputs.current == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: steps.fresh.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.fresh.outputs.current == 'true'
        run: pnpm --filter @superlibrary/content run deploy

  # The SPA to Pages project superlibrary-web. wrangler runs from a neutral directory with an
  # absolute path: Superpipeline's deploy-docs found that project detection rewrites a checkout.
  # The wrangler is the lockfile's (installed under apps/api), not an unpinned download.
  deploy-web:
    needs: [test, e2e, deploy-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: { group: deploy-web, cancel-in-progress: false }
    environment: { name: web, url: https://app.superlibrary.dev }
    steps:
      - uses: actions/checkout@v4
      # Deploys can queue out of order: a run for a superseded commit must not overwrite a newer one.
      - id: fresh
        run: |
          git fetch --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_SHA is no longer the head of main; skipping this deploy"
          fi
      - if: steps.fresh.outputs.current == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.fresh.outputs.current == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: steps.fresh.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.fresh.outputs.current == 'true'
        run: pnpm --filter @superlibrary/web build
      - name: Deploy
        if: steps.fresh.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 88acd85618f099112eadc9374996b9f7
          WRANGLER_SEND_METRICS: 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/wrangler-cwd"
          cd "$RUNNER_TEMP/wrangler-cwd"
          "$GITHUB_WORKSPACE/apps/api/node_modules/.bin/wrangler" pages deploy "$GITHUB_WORKSPACE/apps/web/build" --project-name=superlibrary-web --branch=main
  # superlibrary.dev and docs.superlibrary.dev: build only. They deploy from the operator's
  # machine (scripts/deploy-sites.sh), so CI holds no Cloudflare token for them. npm, scoped
  # to each directory, because both sit outside the pnpm workspace with their own lockfiles.
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: landing
      - run: npm run build
        working-directory: landing
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
      # Every route, MCP tool and frontmatter field the pages name must exist in apps/api.
      - run: node scripts/check-docs-claims.mjs
