name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Which parts changed. A pull request or push that only touches landing/ or docs-site/ runs
  # just their builds; anything else, the workflows themselves, or any other trigger runs it all.
  # A skipped test/e2e on main is safe for the production gate in release.yml: the app's code is
  # then the same as the last commit that ran them, and the gate accepts "skipped" only when this
  # job passed and said so.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.plan.outputs.app }}
      landing: ${{ steps.plan.outputs.landing }}
      docs: ${{ steps.plan.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            app:
              - '**'
              - '!landing/**'
              - '!docs-site/**'
            workflows:
              - '.github/**'
            landing:
              - 'landing/**'
            docs:
              - 'docs-site/**'
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          APP: ${{ steps.filter.outputs.app }}
          WORKFLOWS: ${{ steps.filter.outputs.workflows }}
          LANDING: ${{ steps.filter.outputs.landing }}
          DOCS: ${{ steps.filter.outputs.docs }}
        run: |
          app=false
          case "$EVENT" in push|pull_request) ;; *) app=true ;; esac
          if [ "$APP" = true ] || [ "$WORKFLOWS" = true ]; then app=true; fi
          landing=$LANDING; docs=$DOCS
          if [ "$app" = true ]; then landing=true; docs=true; fi
          { echo "app=$app"; echo "landing=$landing"; echo "docs=$docs"; } >> "$GITHUB_OUTPUT"
          echo "app=$app landing=$landing docs=$docs"

  test:
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The CLI runs under bun.
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The workflow shape (what main deploys, what a tag deploys, and the gates between).
      - run: node --test scripts/ci-workflow.test.mjs

  e2e:
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    # The whole suite (Chromium and WebKit, the seeded loading, fit and motion specs) takes about 15 minutes locally.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Chromium and WebKit builds this Playwright version pins (Chromium's headless shell
      # included), and their system libraries. WebKit runs the containment and phone-width specs.
      - run: pnpm --filter @superlibrary/web exec playwright install --with-deps chromium webkit
      # Writes a fresh dev signing pair (no .dev.vars in CI), then boots the API (:8787), the content
      # Worker (:8788) and the web dev server (:5173), headless.
      - run: pnpm --filter @superlibrary/web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/web/test-results/
          retention-days: 7
      # Every vibe x theme x key screen, for a person to look at (spec D10). Pixel comparison is PW_VISUAL=1, later.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-screens
          path: apps/web/vibe-screens/
          if-no-files-found: ignore
          retention-days: 14

  # Production (API Worker + remote D1 migrations, content Worker, web) deploys from a v* tag, not
  # from main: see deploy-production in release.yml. That job requires this workflow's push run on
  # main for the tagged commit to have passed `test` and `e2e`, so those two job names are a contract.
  # The staging plane (workbench, estate docs/2026-10-22-workbench.md): every push to main, once the
  # unit tests pass. The key is forced to `staging-deploy`, which runs this commit's deploy/staging/deploy.sh.
  deploy-staging:
    needs: [test]
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    environment: { name: staging, url: https://staging-app.superlibrary.dev }
    steps:
      - name: Deploy
        env:
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          HOST: ${{ vars.STAGING_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh root@"$HOST" superlibrary "$GITHUB_SHA"

  # superlibrary.dev and docs.superlibrary.dev: build only. They deploy from the operator's
  # machine (scripts/deploy-sites.sh), so CI holds no Cloudflare token for them. npm, scoped
  # to each directory, because both sit outside the pnpm workspace with their own lockfiles.
  landing:
    needs: [changes]
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: landing
      - run: npm run build
        working-directory: landing
  docs:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
      # Every route, MCP tool and frontmatter field the pages name must exist in apps/api.
      - run: node scripts/check-docs-claims.mjs
